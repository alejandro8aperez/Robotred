<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#073B73"/>
      <stop offset="100%" stop-color="#0B67B2"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD21C"/>
      <stop offset="100%" stop-color="#F4A900"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->
  <!-- Icon: robot + electrical grid -->
  <g transform="translate(65 55)">
    <!-- network nodes -->
    <circle cx="155" cy="20" r="10" fill="#FFD21C"/>
    <circle cx="75" cy="95" r="10" fill="#FFD21C"/>
    <circle cx="235" cy="95" r="10" fill="#FFD21C"/>
    <path d="M155 20 L75 95 M155 20 L235 95" stroke="#0B67B2" stroke-width="8" fill="none"/>

    <!-- transmission tower -->
    <path d="M155 35 L110 335 M155 35 L200 335 M128 205 L182 205 M118 255 L192 255 M108 305 L202 305"
          stroke="#073B73" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M92 112 H218" stroke="#073B73" stroke-width="9"/>
    <path d="M72 100 H238" stroke="#073B73" stroke-width="6"/>

    <!-- robot head -->
    <rect x="112" y="105" width="86" height="68" rx="18" fill="white" stroke="#073B73" stroke-width="9"/>
    <circle cx="137" cy="139" r="9" fill="#0B67B2"/>
    <circle cx="173" cy="139" r="9" fill="#0B67B2"/>
    <path d="M138 158 Q155 168 172 158" stroke="#073B73" stroke-width="6" fill="none"/>

    <!-- antenna -->
    <path d="M155 105 V82" stroke="#073B73" stroke-width="8"/>
    <circle cx="155" cy="74" r="9" fill="#FFD21C"/>

    <!-- robot body -->
    <path d="M105 190 Q155 168 205 190 L218 295 Q155 320 92 295 Z"
          fill="white" stroke="#073B73" stroke-width="10"/>
    <path d="M128 205 H182 V260 H128 Z" fill="#073B73"/>
    <path d="M146 214 L164 214 L154 232 L169 232 L145 255 L151 238 L136 238 Z"
          fill="#FFD21C"/>

    <!-- arms -->
    <path d="M105 205 L62 245 L38 220" stroke="#073B73" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="38" cy="220" r="13" fill="#FFD21C" stroke="#073B73" stroke-width="7"/>
    <path d="M205 205 L248 245 L272 220" stroke="#073B73" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="272" cy="220" r="13" fill="#FFD21C" stroke="#073B73" stroke-width="7"/>

    <!-- lightning -->
    <path d="M155 275 L136 305 H151 L142 330 L174 292 H158 Z" fill="#FFD21C"/>
  </g>

  <!-- Wordmark: ROBOTY-RED. Centrado en x=740, con el separador alineado al
       ancho real del texto (~766 px). Deja ~54 px de respiro respecto al
       icono, que termina en x=303, y alinea descriptor y eslogan. -->
  <text x="740" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="112" font-weight="800" letter-spacing="-4"><tspan fill="#073B73">ROBOTY</tspan><tspan fill="#F4B400">-RED</tspan></text>

  <!-- separator -->
  <rect x="357" y="280" width="766" height="8" rx="4" fill="#F4B400"/>

  <!-- descriptor -->
  <text x="740" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="30" font-weight="600" letter-spacing="3" fill="#073B73">
    ROBÓTICA • INGENIERÍA • REDES ELÉCTRICAS
  </text>

  <!-- tagline -->
  <text x="740" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="27" font-weight="400" fill="#4A5568">
    Tecnología que mantiene tus redes
  </text>
</svg>