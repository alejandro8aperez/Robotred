# Configuración de despliegue — Netlify
# Dominio objetivo: https://robotred.co
# Si cambia el dominio, actualizar también: index.html (canonical, og:url, og:image,
# twitter:image, JSON-LD url), sitemap.xml y robots.txt.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Cabeceras de seguridad
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---------------------------------------------------------------------------
# Caché
# Los archivos no llevan hash en el nombre, así que no se puede usar immutable:
# un cambio en styles.css debe verse sin esperar al navegador.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/gracias.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"